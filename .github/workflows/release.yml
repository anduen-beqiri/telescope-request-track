name: Release

on:
  push:
    branches:
      - 'v*.*.*'
jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}.
  packagist:
    needs: release
    name: Notify Packagist
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Packagist Webhook
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "Packagist credentials not configured."
            exit 1
          fi

          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          ENDPOINT="https://packagist.org/api/update-package"
          PAYLOAD="{\"repository\":{\"url\":\"$REPOSITORY_URL\"}}"

          HTTP_CODE=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --user "$PACKAGIST_USERNAME:$PACKAGIST_TOKEN" \
            --data "$PAYLOAD" \
            "$ENDPOINT")

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Packagist notification failed with HTTP code $HTTP_CODE"
            cat "$RESPONSE_FILE" 2>/dev/null || true
            exit 1
          fi

          echo "Packagist successfully notified."
          cat "$RESPONSE_FILE" 2>/dev/null || true

