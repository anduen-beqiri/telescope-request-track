name: Release

on:
  push:
    branches:
      - 'v*.*.*'
jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}.
  packagist:
    needs: release
    name: Notify Packagist
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Packagist Webhook
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "Packagist credentials not configured. Skipping notification."
            exit 0
          fi

          ENDPOINT="https://packagist.org/api/update-package"
          PAYLOAD="{\"repository\":{\"url\":\"$REPOSITORY_URL\"}}"

          HTTP_CODE=$(curl -s -o packagist-response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --user "$PACKAGIST_USERNAME:$PACKAGIST_TOKEN" \
            --data "$PAYLOAD" \
            "$ENDPOINT") || CURL_EXIT=$?

          if [ -n "${CURL_EXIT:-}" ]; then
            echo "Packagist notification request failed with exit code $CURL_EXIT"
            cat packagist-response.json 2>/dev/null || true
            exit 0
          fi

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Packagist notification failed with HTTP code $HTTP_CODE"
            cat packagist-response.json 2>/dev/null || true
            exit 0
          fi

          echo "Packagist successfully notified."
          cat packagist-response.json 2>/dev/null || true

